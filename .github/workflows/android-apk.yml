name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Live Attendesk URL, including https://"
        required: true
        default: "https://atten-desk.vercel.app"
        type: string

permissions:
  contents: read

jobs:
  build-student-apk:
    name: Build student APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate API URL
        env:
          ATTENDESK_API_URL: ${{ inputs.api_url }}
        run: |
          case "$ATTENDESK_API_URL" in
            https://*) ;;
            *) echo "API URL must begin with https://" >&2; exit 1 ;;
          esac

      - name: Compile APK
        env:
          ATTENDESK_API_URL: ${{ inputs.api_url }}
        run: >-
          gradle -p android --no-daemon clean assembleDebug
          -PATTENDESK_API_URL="$ATTENDESK_API_URL"

      - name: Prepare APK
        run: |
          mkdir -p android/dist
          cp android/app/build/outputs/apk/debug/app-debug.apk android/dist/AttenDesk-student.apk
          sha256sum android/dist/AttenDesk-student.apk > android/dist/AttenDesk-student.apk.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AttenDesk-student-v1.2.0
          path: |
            android/dist/AttenDesk-student.apk
            android/dist/AttenDesk-student.apk.sha256
          if-no-files-found: error
          retention-days: 30
